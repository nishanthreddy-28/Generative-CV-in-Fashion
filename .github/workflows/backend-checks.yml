name: Backend security checks
on:
  push:
    branches: [main, 'feature/**', 'fix/**']
    tags: ['backend-v*']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m pytest -q
      - run: python -m compileall -q app
      - name: Install disposable PostgreSQL test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql libpq-dev
          echo "$(pg_config --bindir)" >> "$GITHUB_PATH"
      - name: Verify migration, grants, RLS and lifecycle isolation
        run: python tests/database/run_local.py
